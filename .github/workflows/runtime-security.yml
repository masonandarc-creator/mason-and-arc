name: Runtime Security Audit
on:
  pull_request:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/runtime-security.yml"
permissions:
  contents: read
jobs:
  runtime-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject high and critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
