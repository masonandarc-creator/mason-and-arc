name: Revit 2027 Connector
on:
  push:
    paths:
      - 'revit-connector/**'
      - '.github/workflows/revit-2027.yml'
  pull_request:
    paths:
      - 'revit-connector/**'
      - '.github/workflows/revit-2027.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build read-only Revit connector for x64
        shell: pwsh
        run: |
          dotnet publish revit-connector/MasonArc.Revit2027/MasonArc.Revit2027.csproj -c Release -r win-x64 --self-contained false -o dist/bin /p:PublishReadyToRun=false
      - name: Make user-level installer archive
        shell: pwsh
        run: |
          Copy-Item revit-connector/Install-MasonArc-Revit2027.ps1 dist/
          Copy-Item revit-connector/Uninstall-MasonArc-Revit2027.ps1 dist/
          Copy-Item revit-connector/README.md dist/
          Compress-Archive -Path dist/* -DestinationPath MasonArc-Revit2027-v0.2.0.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MasonArc-Revit2027-QA-v0.2-Installer
          path: MasonArc-Revit2027-v0.2.0.zip
          if-no-files-found: error
          retention-days: 30
