name: QS Database Integration
on:
  push:
    paths:
      - "db/schema.sql"
      - "db/migrations/20261109-enterprise-quantity-cost-control.sql"
      - "db/seeds/20261109-estimator-catalog.sql"
      - "tests/qs-db.integration.test.cjs"
      - ".github/workflows/qs-integration.yml"
  pull_request:
    paths:
      - "db/schema.sql"
      - "db/migrations/20261109-enterprise-quantity-cost-control.sql"
      - "db/seeds/20261109-estimator-catalog.sql"
      - "tests/qs-db.integration.test.cjs"
      - ".github/workflows/qs-integration.yml"
permissions:
  contents: read
jobs:
  qs-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qs_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d qs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QS_TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/qs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/qs-db.integration.test.cjs
